# The six test suites on a standard GitHub-hosted macOS runner, which is free for
# public repositories. Larger runners are billed even then; do not switch to one.
name: Tests

on:
  push:
    branches: [main]
    paths-ignore: ['backlog/**', '**.md']
  pull_request:
    paths-ignore: ['backlog/**', '**.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # test/test.sh launches the real OpenCode CLI; 1.18.33 is the version the suites are written against.
      - run: npm install -g opencode-ai@1.18.33 && opencode --version
      - run: node test/golden.mjs
      - run: zsh test/test.sh
      - run: zsh test/release.sh
      - run: zsh test/bootstrap.sh
      - run: zsh test/install.sh
      - run: zsh test/migrate.sh
