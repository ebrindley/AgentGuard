# Generated locally after review; publish to activate.
name: Poetic CI incidents
on:
  workflow_run:
    workflows:
      - Full validation
    types:
      - completed
  workflow_dispatch:
    inputs:
      incident_number:
        required: true
        type: string
      expected_attempt:
        required: true
        type: string
      executor_run_id:
        required: true
        type: string
      outcome:
        required: true
        type: choice
        options:
          - retry
          - needs-decision
          - candidate
      repair_pr:
        required: false
        type: string
      repair_sha:
        required: false
        type: string
permissions:
  contents: read
  actions: read
  issues: write
jobs:
  intake:
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    concurrency:
      group: poetic-incident-dispatch
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - run: node .poetic/ci/incident-intake.mjs intake
        env:
          GITHUB_TOKEN: ${{ github.token }}
  reconcile:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
      checks: read
    concurrency:
      group: poetic-incident-dispatch
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - run: node .poetic/ci/incident-intake.mjs reconcile
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POETIC_REPAIR_WORKFLOW: ${{ vars.POETIC_REPAIR_WORKFLOW }}
  dispatch:
    needs:
      - intake
      - reconcile
    if: always() && (needs.intake.result == 'success' || needs.reconcile.result ==
      'success') && vars.POETIC_REPAIR_DISPATCH_ENABLED == 'true' &&
      vars.POETIC_REPAIR_CALLBACK_CONFIGURED == 'true' &&
      vars.POETIC_REPAIR_WORKFLOW != ''
    runs-on: ubuntu-latest
    concurrency:
      group: poetic-incident-dispatch
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      actions: write
      issues: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24"
      - run: node .poetic/ci/incident-intake.mjs dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          POETIC_REPAIR_DISPATCH_ENABLED: ${{ vars.POETIC_REPAIR_DISPATCH_ENABLED }}
          POETIC_REPAIR_WORKFLOW: ${{ vars.POETIC_REPAIR_WORKFLOW }}
          POETIC_REPAIR_CALLBACK_CONFIGURED: ${{ vars.POETIC_REPAIR_CALLBACK_CONFIGURED }}
